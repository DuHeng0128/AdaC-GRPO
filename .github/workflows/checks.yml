name: CPU data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/run_sft_video.sh && bash -n scripts/run_grpo_video.sh
      - run: python scripts/validate_data.py
      - run: python scripts/evaluate_predictions.py --predictions examples/predictions.json --allow-partial
